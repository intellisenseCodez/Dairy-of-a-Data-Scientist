<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}The Diary of a Data Scientist{% endblock %}</title>
<meta name="description" content="{% block desc %}A living A–Z glossary of data science, analytics and data engineering concepts.{% endblock %}">
<meta property="og:title" content="{{ self.title() }}">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="{{ url_for('index') }}">The Diary of a Data Scientist</a>
    <div class="tools">
      <nav id="nav" aria-label="Main">
        <ul>
          <li><a href="{{ url_for('index') }}#glossary">Glossary</a></li>
          <li><a href="{{ url_for('index') }}#how">How it works</a></li>
          <li><a href="{{ url_for('index') }}#roadmap">Who it is for</a></li>
          <li><a href="{{ url_for('index') }}#contribute">Contribute</a></li>
          <li><a class="cta" href="{{ url_for('index') }}#join">Join early access</a></li>
        </ul>
      </nav>
      <button class="icon-btn" id="theme" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
      <button class="icon-btn menu-btn" id="menu" aria-label="Open menu" aria-expanded="false" aria-controls="nav">☰</button>
    </div>
  </div>
</header>

<main id="top">
{% block content %}{% endblock %}
</main>

<footer><div class="wrap">© {{ year }} The Diary of a Data Scientist. Entries are written to be learned from, one letter at a time.</div></footer>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
